[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kuping-negara"
version = "0.1.0"
description = "Fondasi MLOps untuk pemantauan sentimen publik terhadap program prioritas pemerintah Indonesia."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Ahmad Nafi Mubarok" }
]
dependencies = [
  "pandas>=2.2,<4",
  "pyyaml>=6,<7",
  "scikit-learn>=1.5,<2"
]

[project.scripts]
collect-x-data = "kuping_negara.ingestion.tweet_harvest:main"
preprocess-x-data = "kuping_negara.preprocessing.x_pipeline:main"
train-sentiment = "kuping_negara.training.cli:main"

[project.optional-dependencies]
dev = [
  "jupyterlab>=4.2,<5",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]
data-versioning = [
    "dvc>=3,<4",
]
google-drive = [
    "dvc[gdrive]>=3,<4",
    # PyDrive2 1.21.3 caps cryptography; older releases break OAuth imports.
    "pydrive2>=1.21.3,<2",
    # Match PyDrive2's cryptography range; PyOpenSSL 22 fails at import.
    "pyopenssl>=24.2.1,<25",
]
training = [
    "matplotlib>=3.9,<4",
    "mlflow>=3,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
