name: kuping-negara-scheduler

services:
  postgres:
    image: postgres:16.13-bookworm
    environment:
      POSTGRES_USER: airflow
      POSTGRES_DB: airflow
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    image: kuping-negara-airflow:3.3.2
    # Root only prepares mounts; start.py drops to UID 50000 before Airflow starts.
    user: "0:0"
    entrypoint: ["/usr/bin/dumb-init", "--", "python", "/opt/airflow/start.py"]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Jakarta
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__CORE__FERNET_KEY_CMD: cat /run/secrets/fernet_key
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: >-
        bash -c 'printf "postgresql+psycopg2://airflow:%s@postgres/airflow" "$$(cat /run/secrets/postgres_password)"'
      AIRFLOW__API_AUTH__JWT_SECRET_CMD: cat /run/secrets/jwt_secret
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://localhost:8080/execution/
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json
      AIRFLOW__API__WORKERS: "1"
      AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Asia/Jakarta
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
      AIRFLOW__SCHEDULER__CATCHUP_BY_DEFAULT: "false"
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:8080:8080"
    shm_size: 1gb
    volumes:
      - ./data:/opt/kuping-negara/data
      - airflow-logs:/opt/airflow/logs
      - airflow-auth:/opt/airflow/auth
    secrets:
      - postgres_password
      - fernet_key
      - jwt_secret
      - admin_password
      - x_auth_token
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Require component heartbeats, rather than just an open UI HTTP port.
      test: [CMD, python, /opt/airflow/healthcheck.py]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    stop_grace_period: 60s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  mlflow:
    profiles: [training]
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    image: kuping-negara-ml:latest
    init: true
    environment:
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5).read()"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  trainer:
    profiles: [training]
    image: kuping-negara-ml:latest
    init: true
    entrypoint: [python, /opt/kuping-negara/docker/mlflow/train.py]
    command: [run, --dataset, data/training/sentiment_expanded_20261019.csv, --config, configs/training/expanded.json, --output, reports/training/expanded_20261019_docker, --allow-provisional, --tracking-uri, "http://mlflow:5000"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      GIT_OPTIONAL_LOCKS: "0"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /opt/kuping-negara
      TZ: Asia/Jakarta
    volumes:
      - ./data:/opt/kuping-negara/data:ro
      - ./reports:/opt/kuping-negara/reports
      - ./.git:/opt/kuping-negara/.git:ro
    depends_on:
      mlflow:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

secrets:
  postgres_password:
    file: ./docker/airflow/secrets/postgres_password
  fernet_key:
    file: ./docker/airflow/secrets/fernet_key
  jwt_secret:
    file: ./docker/airflow/secrets/jwt_secret
  admin_password:
    file: ./docker/airflow/secrets/admin_password
  x_auth_token:
    file: ./docker/airflow/secrets/x_auth_token

volumes:
  postgres-data:
  airflow-logs:
  airflow-auth:
  mlflow-data:
