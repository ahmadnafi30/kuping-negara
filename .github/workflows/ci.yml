name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feat/**"
      - "fix/**"
      - "refactor/**"
      - "chore/**"
      - "docs/**"
      - "test/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: "3.12"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.12"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --locked --extra dev --extra data-versioning --extra google-drive --extra training

      - name: Check dependency consistency
        run: uv pip check

      - name: Verify Google Drive OAuth backend
        run: uv run --locked --extra dev --extra data-versioning --extra google-drive --extra training python -c "from pydrive2.auth import GoogleAuth; from pydrive2.fs import GDriveFileSystem"

      - name: Check code quality
        run: uv run --locked --extra dev --extra data-versioning --extra google-drive --extra training ruff check src tests dags docker/airflow train.py

      - name: Check code formatting
        run: uv run --locked --extra dev --extra data-versioning --extra google-drive --extra training ruff format --check src tests dags docker/airflow train.py

      - name: Run environment health check
        run: uv run --locked --extra dev --extra data-versioning --extra google-drive --extra training python -m kuping_negara.healthcheck

      - name: Run tests
        run: uv run --locked --extra dev --extra data-versioning --extra google-drive --extra training pytest

  airflow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Create ephemeral local secrets
        run: python docker/airflow/bootstrap.py
      - name: Validate Compose and build image
        run: |
          docker compose config --quiet
          docker compose build airflow
      - name: Start local stack with paused DAGs
        run: docker compose up -d --wait --wait-timeout 180
      - name: Verify DAGs and isolated application environment
        run: |
          docker compose exec -T --user 50000:0 airflow python /opt/airflow/verify_dags.py
          docker compose exec -T --user 50000:0 airflow uv pip check --python /opt/kuping-negara/.venv/bin/python
          docker compose exec -T --user 50000:0 airflow node /opt/collector/verify.cjs
      - name: Stop containers
        if: always()
        run: docker compose down
