name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.12.12"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --frozen --extra dev

      - name: Check dependency consistency
        run: uv pip check

      - name: Run environment health check
        run: uv run --frozen --extra dev python -m kuping_negara.healthcheck

      - name: Run tests
        run: uv run --frozen --extra dev pytest
